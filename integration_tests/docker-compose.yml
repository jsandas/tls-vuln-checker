services:
  # nginx 1.30.0 + OpenSSL 3.5.7 (patched) — default image config: TLS 1.2 + TLS 1.3
  # Mount to conf.d/default.conf — the path nginx 1.30.0 reads SSL config from.
  nginx_1.30.0_tls12-tls13:
    image: ghcr.io/jsandas/nginx-1.30.0_openssl-3.5.7
    ports:
      - "443:443"
    volumes:
      - ./nginx/1.30.0/tls12+/default.conf:/etc/nginx/conf.d/default.conf:ro

  # nginx 1.30.0 + OpenSSL 3.5.7 (patched) — TLS 1.2 only
  # Mount to conf.d/default.conf — the path nginx 1.30.0 reads SSL config from.
  nginx_1.30.0_tls12:
    image: ghcr.io/jsandas/nginx-1.30.0_openssl-3.5.7
    ports:
      - "1443:443"
    volumes:
      - ./nginx/1.30.0/tls12/default.conf:/etc/nginx/conf.d/default.conf:ro

  # nginx 1.30.0 + OpenSSL 3.5.7 (patched) — TLS 1.0–1.3
  # Mount to conf.d/default.conf — the path nginx 1.30.0 reads SSL config from.
  nginx_1.30.0_tls10-tls13:
    image: ghcr.io/jsandas/nginx-1.30.0_openssl-3.5.7
    ports:
      - "2443:443"
    volumes:
      - ./nginx/1.30.0/tls10+/default.conf:/etc/nginx/conf.d/default.conf:ro

  # nginx 1.2.9 + OpenSSL 1.0.1f (vulnerable) — TLS 1.2 only
  # Mount to /usr/local/nginx/conf/nginx.conf — the path this image's nginx reads from.
  nginx_1.2.9_tls12:
    image: ghcr.io/jsandas/nginx-1.2.9_openssl-1.0.1f
    ports:
      - "3443:443"
    volumes:
      - ./nginx/1.2.9/tls12/nginx.conf:/usr/local/nginx/conf/nginx.conf:ro

  # nginx 1.2.9 + OpenSSL 1.0.1f (vulnerable) — TLS 1.0–1.2
  # Mount to /usr/local/nginx/conf/nginx.conf — the path this image's nginx reads from.
  nginx_1.2.9_tls10-tls12:
    image: ghcr.io/jsandas/nginx-1.2.9_openssl-1.0.1f
    ports:
      - "4443:443"
    volumes:
      - ./nginx/1.2.9/tls10+/nginx.conf:/usr/local/nginx/conf/nginx.conf:ro

  # nginx 1.2.9 + OpenSSL 1.0.1f (vulnerable) — default image config: SSLv2–TLS 1.2
  # Mount to /usr/local/nginx/conf/nginx.conf — the path this image's nginx reads from.
  nginx_1.2.9_sslv2-tls12:
    image: ghcr.io/jsandas/nginx-1.2.9_openssl-1.0.1f
    ports:
      - "5443:443"
    volumes:
      - ./nginx/1.2.9/sslv2+/nginx.conf:/usr/local/nginx/conf/nginx.conf:ro
